# .github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Opt into Node.js 24 for GitHub Actions runners now, ahead of the
    # forced migration on June 2 2026, to silence the Node 20 deprecation
    # warning produced by actions/checkout and actions/setup-python.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy dbt_scribe

      - name: Run pytest
        run: pytest
