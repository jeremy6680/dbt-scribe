[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbt-scribe"
version = "0.1.1"
description = "LLM-powered documentation and test generation for dbt Core projects"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jeremy Marchandeau", email = "hey@jeremymarchandeau.com" }]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=1.0",
    "sqlglot>=25.0",
    "python-dotenv>=1.0",
]

[project.scripts]
dbt-scribe = "dbt_scribe.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["dbt_scribe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
python_classes = []

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
