name: "fixture_project"
version: "1.0.0"
config-version: 2

profile: "fixture_project"

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  fixture_project:
    staging:
      +materialized: view
      +persist_docs:
        relation: true
        columns: true
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +persist_docs:
        relation: true
        columns: true
